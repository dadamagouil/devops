name: Quality checks (reusable)

# Two free checks, no AI, identical everywhere:
#  - actionlint: mistakes in the GitHub workflow files;
#  - gitleaks:   a key or password pasted in the code (the whole history is scanned).
# Call it from a project workflow:
#   jobs:
#     quality:
#       uses: dadamagouil/devops/.github/workflows/quality.yml@develop
#       with:
#         runner-labels: ${{ vars.RUNNER_LABELS || '["ubuntu-latest"]' }}
on:
  workflow_call:
    inputs:
      devops-ref:
        description: >
          Version of dadamagouil/devops whose building blocks (actions) this workflow uses. To freeze everything,
          give the same tag as the `@` of this workflow, for example `v1.0.1`. Default: develop.
        type: string
        default: develop
      runner-labels:
        description: JSON array of runner labels
        type: string
        default: '["ubuntu-latest"]'
      actionlint-version:
        type: string
        default: "1.7.7"
      actionlint-sha256:
        description: sha256 of the actionlint linux_amd64 archive (a changed file fails the check)
        type: string
        default: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
      gitleaks-version:
        type: string
        default: "8.21.2"
      gitleaks-sha256:
        description: sha256 of the gitleaks linux_x64 archive (a changed file fails the check)
        type: string
        default: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: gitleaks reads every commit, and a secret deleted later stays in old commits.
          fetch-depth: 0
      - name: Get the devops building blocks (same version as this workflow)
        uses: actions/checkout@v7
        with:
          repository: dadamagouil/devops
          ref: ${{ inputs.devops-ref }}
          path: .devops
      - uses: ./.devops/.github/actions/prepare-runner
        with:
          commands: "git curl tar sha256sum"

      - name: Download the tools
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
          ACTIONLINT_SHA256: ${{ inputs.actionlint-sha256 }}
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/actionlint" "$RUNNER_TEMP/tools/gitleaks"
          # -f: an error page (for example "504") is not saved as if it were the program;
          # --retry: GitHub sometimes answers with a passing error, so we try a few times.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/tools/actionlint"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/tools/gitleaks"

      - name: Workflow files (actionlint)
        run: '"$RUNNER_TEMP/tools/actionlint/actionlint" -color'

      - name: Secrets left in the code (gitleaks)
        run: '"$RUNNER_TEMP/tools/gitleaks/gitleaks" detect --source . --no-banner --redact --verbose'
