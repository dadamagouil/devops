name: SQL tests

# Runs only when the backend changes. Not on every working branch: on develop and on pull requests to develop / main.
on:
  push:
    branches: [develop]
    paths: ["supabase/**", ".github/workflows/sql-tests.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["supabase/**", ".github/workflows/sql-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql:
    uses: dadamagouil/devops/.github/workflows/supabase-sql-tests.yml@v1.0.2
    with:
      devops-ref: v1.0.2   # same version as the @ above; change both together to upgrade
