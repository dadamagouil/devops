name: SQL tests

# Runs only when the backend changes. Not on every working branch: on develop and on pull requests to develop / main.
on:
  push:
    branches: [develop]
    paths: ["supabase/**", ".github/workflows/sql-tests.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["supabase/**", ".github/workflows/sql-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql:
    uses: dadamagouil/devops/.github/workflows/supabase-sql-tests.yml@develop
    with:
      devops-ref: develop   # to freeze: the same tag as the @ above (for example v1.0.1)
