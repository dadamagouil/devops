name: Quality checks

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: dadamagouil/devops/.github/workflows/quality.yml@v1.0.2
    with:
      devops-ref: v1.0.2   # same version as the @ above; change both together to upgrade
      runner-labels: ${{ vars.RUNNER_LABELS || '["ubuntu-latest"]' }}
