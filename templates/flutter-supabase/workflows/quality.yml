name: Quality checks

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: dadamagouil/devops/.github/workflows/quality.yml@develop
    with:
      devops-ref: develop   # to freeze: the same tag as the @ above (for example v1.0.1)
      runner-labels: ${{ vars.RUNNER_LABELS || '["ubuntu-latest"]' }}
