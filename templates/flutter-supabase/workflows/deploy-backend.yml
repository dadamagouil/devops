name: Deploy Supabase backend

on:
  push:
    branches: [develop]
    paths: ["supabase/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: dadamagouil/devops/.github/workflows/supabase-deploy.yml@v1.0.2
    with:
      devops-ref: v1.0.2   # same version as the @ above; change both together to upgrade
      environment: dev
      functions: ""   # for example "bootstrap-user session-maintenance"
      runner-labels: ${{ vars.RUNNER_LABELS || '["ubuntu-latest"]' }}
    secrets: inherit
